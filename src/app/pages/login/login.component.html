<div class="login-page">
  <!-- Lado esquerdo com imagem -->
  <div class="login-left">
    <img src="assets/geriatrica.jpg" alt="Imagem ilustrativa" />
  </div>

  <!-- Lado direito com formulário -->
  <div class="login-right">
    <div class="login-box">
      <!-- Logo acima do título -->
      <div class="logo">
        <img src="assets/logo.png" alt="Logo da Clínica" />
      </div>

      <h2>Área do Colaborador</h2>

      <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
        <input
          type="email"
          placeholder="Insira seu e-mail"
          [(ngModel)]="username"
          name="username"
          required
        />

        <input
          type="password"
          placeholder="Insira sua senha"
          [(ngModel)]="password"
          name="password"
          required
        />

        <button type="submit" [disabled]="!loginForm.form.valid">
          Entrar
        </button>
      </form>
    </div>
  </div>
</div>
